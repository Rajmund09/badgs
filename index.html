<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajmund09 | Project Showcase</title>
    <meta name="description" content="A showcase of innovative projects in AI, ML, and Web Development by Prabhu shankar Mund (Rajmund09).">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>Innovative Builds</h1>
            <p>Exploring the intersection of AI, Web Technologies, and Data Structures. A curated collection of my work on GitHub.</p>
            
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">All Projects</button>
                <button class="filter-btn" data-filter="Python">Python</button>
                <button class="filter-btn" data-filter="HTML">Web Dev</button>
                <button class="filter-btn" data-filter="C++">C++</button>
                <button class="filter-btn" data-filter="AI">AI/ML</button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search projects by name, tag, or technology...">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </header>

        <main class="project-grid" id="projectGrid">
            <!-- Projects will be dynamically injected here -->
        </main>

        <footer style="text-align: center; padding: 4rem 0; color: var(--text-muted); font-size: 0.9rem;">
            <p>&copy; 2026 Prabhu shankar Mund (Rajmund09). Built with Passion.</p>
            <p style="margin-top: 1rem;">
                <a href="https://github.com/Rajmund09" target="_blank" style="color: var(--primary); text-decoration: none;">GitHub</a> • 
                <a href="https://prabhu-shankar-portfolio.vercel.app/" target="_blank" style="color: var(--primary); text-decoration: none;">Portfolio</a>
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
